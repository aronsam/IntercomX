<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SweetPotato Intercom</title>
<style>
:root{--ink:#eef3ef;--mute:#9bb0ab;--amber:#f2b134}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#070b10;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;overflow:hidden}

/* ---------- Setup screen ---------- */
#setup{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
  background:linear-gradient(rgba(5,8,12,.82),rgba(5,8,12,.82)),url('bg.jpg') center/cover no-repeat #070b10}
.panel{width:100%;max-width:420px;background:rgba(20,32,40,.88);border:2px solid #1f6fb0;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;
  box-shadow:0 0 14px 2px rgba(0,150,255,.35),inset 0 0 14px rgba(0,150,255,.15);animation:heartbeat 3s ease-in-out infinite}
/* Slow heartbeat glow (blue, same as the ring in the picture): lub-dub, then rest */
@keyframes heartbeat{
  0%,100%{box-shadow:0 0 14px 2px rgba(0,150,255,.35),inset 0 0 14px rgba(0,150,255,.15);border-color:#1f6fb0}
  14%{box-shadow:0 0 36px 9px rgba(0,170,255,.9),inset 0 0 28px rgba(0,170,255,.4);border-color:#3db2ff}
  28%{box-shadow:0 0 18px 3px rgba(0,150,255,.45),inset 0 0 16px rgba(0,150,255,.2);border-color:#2a82c8}
  42%{box-shadow:0 0 28px 6px rgba(0,170,255,.7),inset 0 0 22px rgba(0,170,255,.32);border-color:#35a4ee}
  70%{box-shadow:0 0 14px 2px rgba(0,150,255,.35),inset 0 0 14px rgba(0,150,255,.15);border-color:#1f6fb0}
}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
h1{font-size:1.4rem;margin:0;text-align:center}
label{font-size:.9rem;color:var(--mute);text-align:center}
input[type=text]{font:inherit;font-size:1.6rem;letter-spacing:.2em;text-align:center;padding:10px;border-radius:8px;border:2px solid #3a5a6c;background:#0b1218;color:var(--ink);width:100%}
.row{display:flex;gap:10px}
.row button{flex:1}
.btn{font:inherit;font-weight:600;padding:14px;border-radius:8px;border:0;cursor:pointer;background:var(--amber);color:#1b1b1b}
.btn.alt{background:transparent;color:var(--ink);border:2px solid #4b6a7c}
#log{font-size:.8rem;color:var(--mute);text-align:center;min-height:1.2em}

/* ---------- Call screen: the picture IS the control panel ---------- */
#call{display:none;position:fixed;inset:0;background:#070b10;align-items:center;justify-content:center}
.stage{position:relative;width:min(100vw,calc(100dvh*.4497));aspect-ratio:841/1870;background:url('bg.jpg') center/100% 100% no-repeat}
.hot{position:absolute;transform:translate(-50%,-50%);border:0;padding:0;margin:0;background:transparent;cursor:pointer;touch-action:none}
.hot:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

#status{position:absolute;left:50%;top:2.4%;transform:translateX(-50%);padding:6px 14px;border-radius:999px;background:rgba(5,8,12,.72);font-size:.85rem;font-weight:600;white-space:nowrap;pointer-events:none}

/* Push and Talk = the big round button */
#ptt{left:50%;top:42.2%;width:80%;aspect-ratio:1;border-radius:50%;transition:box-shadow .1s,background .1s}
#ptt:disabled{background:rgba(0,0,0,.55);cursor:default}
#ptt.live{background:radial-gradient(circle,rgba(0,170,255,.28),rgba(0,170,255,0) 72%);box-shadow:0 0 40px 8px rgba(0,170,255,.75),inset 0 0 60px rgba(0,170,255,.45)}

/* Open mic = the walkie-talkie; red light when ON */
#open{left:50%;top:75.9%;width:46%;height:17%;border-radius:20%}
#open::after{content:"";position:absolute;inset:-12%;border-radius:50%;pointer-events:none;opacity:0;transition:opacity .15s;mix-blend-mode:screen;
  background:radial-gradient(ellipse at center,rgba(255,40,30,.75) 0%,rgba(255,40,30,.35) 45%,rgba(255,40,30,0) 72%)}
#open[aria-checked="true"]::after{opacity:1}

/* End = the red button */
#end{left:50%;top:89.8%;width:57%;height:8.6%;border-radius:28px}
#end:active{background:rgba(255,255,255,.18)}

@media (prefers-reduced-motion:reduce){#ptt,#open::after{transition:none}}
</style>
</head>
<body>

<section id="setup">
  <div class="panel">
    <h1>SweetPotato Intercom</h1>
    <label for="code">Use the same code on all phones</label>
    <input id="code" type="text" maxlength="8" autocomplete="off" autocapitalize="characters" placeholder="RCV01">
    <div class="row">
      <button id="host" class="btn">Create Room</button>
      <button id="join" class="btn alt">Join</button>
    </div>
    <div id="log">Tap "Create Room" on the first phone. On the others, enter the same code and tap Join.</div>
  </div>
</section>

<section id="call">
  <div class="stage">
    <div id="status">Connecting…</div>
    <button id="ptt" class="hot" disabled aria-label="Push and talk"></button>
    <button id="open" class="hot" role="switch" aria-checked="false" aria-label="Open mic"></button>
    <button id="end" class="hot" aria-label="End call"></button>
  </div>
</section>
<div id="audios"></div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const PREFIX = 'gs-intercom-v2-';
let peer, stream, wake, isHost, joined, roomCode, openMic = false;
let calls = {};            // peerId -> call
let members = new Set();   // host only: who is in the room

const log = t => $('log').textContent = t;

function refresh(){
  const n = Object.keys(calls).length;
  $('status').textContent = n ? `Room ${roomCode}: ${n} connected ✔` : `Room ${roomCode}: waiting for others…`;
  $('ptt').disabled = n === 0;
}

async function start(mode){
  const code = $('code').value.trim().toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(code.length < 3){ log('Enter a room code (3–8 letters/numbers).'); return; }
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
  }catch(e){ log('Cannot access the mic. Allow the permission and use HTTPS.'); return; }
  stream.getAudioTracks()[0].enabled = false;
  isHost = mode === 'host'; roomCode = code; joined = false;
  $('setup').style.display = 'none'; $('call').style.display = 'flex';
  try{ wake = await navigator.wakeLock?.request('screen'); }catch(e){}

  const hostId = PREFIX + code;
  peer = isHost ? new Peer(hostId) : new Peer();
  refresh();

  peer.on('error', e => {
    if(e.type === 'unavailable-id') fail('That room code is already in use. Pick another code.');
    else if(e.type === 'peer-unavailable'){ if(!joined) fail('No room with that code. Create it on the other phone first.'); }
    else if(e.type !== 'webrtc') fail('Error: ' + e.type);
  });

  peer.on('call', c => { c.answer(stream); attach(c); });

  if(isHost){
    peer.on('open', id => members.add(id));
    peer.on('connection', conn => {
      conn.on('open', () => { conn.send({peers:[...members]}); members.add(conn.peer); });
      conn.on('close', () => members.delete(conn.peer));
    });
  }else{
    peer.on('open', () => {
      const conn = peer.connect(hostId);
      conn.on('open', () => { joined = true; });
      conn.on('data', d => (d.peers || []).forEach(id => { if(!calls[id]) attach(peer.call(id, stream)); }));
    });
  }
}

function attach(c){
  const id = c.peer;
  calls[id] = c;
  c.on('stream', rs => {
    let a = $('a-' + id);
    if(!a){ a = document.createElement('audio'); a.id = 'a-' + id; a.autoplay = true; a.playsInline = true; $('audios').appendChild(a); }
    a.srcObject = rs; a.play().catch(()=>{});
    refresh();
  });
  const gone = () => { delete calls[id]; $('a-' + id)?.remove(); refresh(); };
  c.on('close', gone); c.on('error', gone);
}

function fail(msg){ cleanup(); $('call').style.display='none'; $('setup').style.display='flex'; log(msg); }
function cleanup(){
  Object.values(calls).forEach(c => { try{c.close()}catch(e){} });
  try{peer?.destroy()}catch(e){}
  stream?.getTracks().forEach(t=>t.stop()); try{wake?.release()}catch(e){}
  $('audios').innerHTML = '';
  calls = {}; members = new Set(); peer = stream = null;
  openMic = false; $('open').setAttribute('aria-checked','false');
  $('ptt').disabled = true; $('ptt').classList.remove('live');
}

// Talk control
const setTalk = on => {
  if(!stream) return;
  stream.getAudioTracks()[0].enabled = on;
  $('ptt').classList.toggle('live', on);
};
const ptt = $('ptt');
ptt.addEventListener('pointerdown', e => { e.preventDefault(); if(!openMic) setTalk(true); });
['pointerup','pointercancel','pointerleave'].forEach(ev => ptt.addEventListener(ev, () => { if(!openMic) setTalk(false); }));
ptt.addEventListener('contextmenu', e => e.preventDefault());

// Open mic switch (walkie-talkie): red light = ON
$('open').addEventListener('click', () => {
  openMic = !openMic;
  $('open').setAttribute('aria-checked', String(openMic));
  setTalk(openMic);
});

$('host').onclick = () => start('host');
$('join').onclick = () => start('join');
$('end').onclick = () => fail('Call ended.');
</script>
</body>
</html>
